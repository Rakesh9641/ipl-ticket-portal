<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}IPL Booking{% endblock %}</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        .navbar {
            background: rgba(0,0,0,0.7);
        }

        .navbar-brand {
            color: #ffcc00 !important;
            font-weight: bold;
        }

        .nav-btn {
            margin-left: 10px;
            border-radius: 20px;
            padding: 6px 15px;
            text-decoration: none;
            color: white;
        }

        .btn-login {
            background: #007bff;
        }

        .btn-register {
            background: #28a745;
        }

        .btn-logout {
            background: #dc3545;
        }

        .btn-main {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }

        .nav-btn:hover {
            opacity: 0.8;
        }

        footer {
            background: rgba(0,0,0,0.6);
            padding: 10px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<!-- ✅ NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">🏏 IPL Booking</a>

        <!-- FIXED TOGGLER -->
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <div class="ms-auto d-flex align-items-center flex-wrap">

                <!-- ALWAYS -->
                <a href="/matches" class="nav-btn btn-main">
                    <i class="fas fa-ticket-alt"></i> Matches
                </a>

                <a href="/about" class="nav-btn btn-main">
                    About
                </a>

                <a href="/contact" class="nav-btn btn-main">
                    Contact
                </a>

                <!-- USER -->
                {% if session.get('user_id') %}
                    <span class="ms-3">Hi, {{ session.get('user_name') }}</span>

                    <a href="/logout" class="nav-btn btn-logout">
                        Logout
                    </a>

                {% else %}
                    <a href="/login" class="nav-btn btn-login">
                        Login
                    </a>

                    <a href="/register" class="nav-btn btn-register">
                        Register
                    </a>
                {% endif %}

                <!-- ADMIN
                <a href="/admin" class="nav-btn btn-main">
                    Admin
                </a> -->

            </div>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 IPL Ticket Booking</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
